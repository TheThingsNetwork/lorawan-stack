name: Tag release

on:
  workflow_dispatch:
    inputs:
      skip_goreleaser:
        description: >-
          Skip building and publishing artifacts. Only use this when GoReleaser already published the release and the
          post release steps (latest tag, buf push, merge PR) need to run again.
        type: boolean
        default: false

env:
  NODE_ENV: production

jobs:
  summary:
    name: Workflow summary
    runs-on: ubuntu-latest
    steps:
      - name: Workflow summary
        run: |
          export TAG=$(echo ${{ github.ref_name }} | grep -Po '3\.\d+.\d+')
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## Tag Release

          | Property | Value |
          | --- | --- |
          | **Branch** | \`${{ github.ref_name }}\` |
          | **Tag** | \`v${TAG}\` |
          | **Commit** | \`${{ github.sha }}\` |
          | **Triggered by** | [${{ github.actor }}](https://github.com/${{ github.actor }}) |
          | **Skip GoReleaser** | \`${{ inputs.skip_goreleaser }}\` |
          EOF
  release:
    name: Tag release
    if: ${{ !inputs.skip_goreleaser }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
    timeout-minutes: 90
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0
        with:
          skip-components: docker-engine,cached-go,cached-node,aws-cli,gh-cli
          swapfile-size: 2G
      - name: Check branch
        run: echo "${{ github.ref_name }}" | grep -Pq '^release/v3\.\d+\.\d+$'
      - name: Get version
        id: version
        run: |
          export VERSION=$(echo ${{ github.ref_name }} | grep -Po '3\.\d+.\d+')
          echo "result=$VERSION" >> $GITHUB_OUTPUT
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Insert release date into the changelog
        run: |
          sed -i "s/^\(## \[.*\] - \)\(unreleased\)$/\1$(date +%Y-%m-%d)/" CHANGELOG.md
          set +e
          git diff --exit-code --quiet CHANGELOG.md
          R=$?
          set -e
          git config user.name "The Things Bot"
          git config user.email "github@thethingsindustries.com"
          if [ $R -eq 1 ]; then
            git add CHANGELOG.md
            git commit -m "all: Enter release date of version ${{ steps.version.outputs.result }} into the changelog"
            git push
            git tag v${{ steps.version.outputs.result }}
            git push origin v${{ steps.version.outputs.result }}
          fi
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: "${{ secrets.AWS_REGION }}"
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_USER_ID }}:role/${{ secrets.AWS_ROLE_NAME }}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_PASSWORD }}"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: "${{ secrets.GHCR_USERNAME }}"
          password: "${{ secrets.GHCR_PASSWORD }}"
      - name: Update APT
        run: sudo apt-get -yq update
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic
      - name: Create Snapcraft folders
        run: |
          mkdir -p $HOME/.cache/snapcraft/download
          mkdir -p $HOME/.cache/snapcraft/stage-packages
      - name: Install Go and Dependencies
        uses: ./.github/actions/install-go-and-deps
      - name: Build Mage
        uses: ./.github/actions/build-mage
      - name: Install Node and Dependencies
        uses: ./.github/actions/install-node-and-deps
      - name: Initialize device repository index cache
        id: dr-index-cache
        uses: actions/cache@v6
        with:
          path: data/lorawan-devices-index
          key: dr-index-cache-${{ hashFiles('data/lorawan-devices') }}
      - name: Create device repository index
        run: tools/bin/mage dev:initDeviceRepo
        if: steps.dr-index-cache.outputs.cache-hit != 'true'
      - name: Auto-completion scripts
        run: tools/bin/mage cli:autocomplete
        timeout-minutes: 5
      - name: Build Frontend
        uses: ./.github/actions/build-frontend
        with:
          production-sourcemaps: "true"
      - name: Check for diff
        run: tools/bin/mage git:diff
      - name: Generate Release Notes
        run: |
          awk '/^## \[${{ steps.version.outputs.result }}\]/{flag=1;next} /^## \[/{flag=0} flag' CHANGELOG.md > /tmp/release-notes.md
      - name: Import the signing key
        run: |
          printf '%s' '${{ secrets.SIGNATURE_PASSPHRASE }}' >/tmp/gpg_passphrase
          cat /tmp/gpg_passphrase | gpg --passphrase-fd 0 --no-tty --batch --import gpg_signing_key
      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --config .goreleaser.release.yml --release-notes /tmp/release-notes.md --timeout 120m
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SIGN_KEY_NAME: ${{ secrets.SIGN_KEY_NAME }}
  post-release:
    name: Post release
    needs: [release]
    # Run when the release job succeeded or was skipped with skip_goreleaser.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check branch
        run: echo "${{ github.ref_name }}" | grep -Pq '^release/v3\.\d+\.\d+$'
      - name: Get version
        id: version
        run: |
          export VERSION=$(echo ${{ github.ref_name }} | grep -Po '3\.\d+.\d+')
          echo "result=$VERSION" >> $GITHUB_OUTPUT
      - name: Check that the release is published
        run: gh release view "v${{ steps.version.outputs.result }}" --repo "${{ github.repository }}" --json tagName
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Check out the branch tip instead of the triggering commit, so that the changelog commit and the release tag
          # pushed by the release job are included.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_PASSWORD }}"
      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1
      - name: Determine if released version is latest
        id: latest-version
        run: |
          export LATEST_TAG=$(git tag | grep -P '^v3.\d+\.\d+$' | sort -V | tail -n 1)
          set +e
          test "$LATEST_TAG" != 'v${{ steps.version.outputs.result }}'
          echo "latest=$?" >> $GITHUB_OUTPUT
      - name: Tag latest
        if: steps.latest-version.outputs.latest == '1'
        # The images are copied within the registry, as this job does not have the images built by GoReleaser.
        # --prefer-index=false copies the manifests as is, instead of wrapping single images in a new image index.
        run: |
          export VERSION=$(echo ${{ steps.version.outputs.result }} | grep -Po '3\.\d+')
          for ARCH in amd64 arm64 armv7; do
            docker buildx imagetools create --prefer-index=false --tag ${DOCKER_PREFIX}/lorawan-stack:latest-${ARCH} ${DOCKER_PREFIX}/lorawan-stack:${VERSION}-${ARCH}
          done
          docker buildx imagetools create --prefer-index=false --tag ${DOCKER_PREFIX}/lorawan-stack:latest ${DOCKER_PREFIX}/lorawan-stack:${VERSION}
        env:
          DOCKER_PREFIX: thethingsnetwork
      - uses: bufbuild/buf-action@v1
        with:
          push: true
          input: api
          token: ${{ secrets.BUF_TOKEN }}
      - name: Prepare merge PR
        run: |
          if [ -n "$(gh pr list --head '${{ github.ref_name }}' --state all --json number --jq '.[].number')" ]; then
            echo "Merge PR for ${{ github.ref_name }} already exists"
            exit 0
          fi

          export PR_URL=$(mktemp)

          gh pr create \
              --assignee '${{ github.actor }}' \
              --base "$(echo ${{ steps.version.outputs.result }} | grep -Po 'v3\.\d+')" \
              --body "This pull request merges back changes from the v${{ steps.version.outputs.result }} release." \
              --label "release" \
              --title "Release v${{ steps.version.outputs.result }}" \
              | tee "${PR_URL}"

          # Try adding a milestone but ignore errors
          gh pr edit < "${PR_URL}" \
              --milestone "v${{ steps.version.outputs.result }}" \
              || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
